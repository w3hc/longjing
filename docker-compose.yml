version: '3.8'

services:
  longjing:
    # v0.4.0, pinned by digest so the attested compose hash commits to the image.
    # Take the digest from the release notes, see docs/DOCKER.md#releases.
    image: ghcr.io/w3hc/longjing@sha256:52469132dec455610d391621aee0e012ed33a80b77db8b818da51a1ed0c9974a
    ports:
      - "3000:3000"
    volumes:
      # dstack guest agent: key derivation, TLS key and quotes
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      # Literals, so the attested compose hash commits to production mode.
      # NODE_ENV=production refuses chain 31337, placeholders and the dstack
      # simulator, and requires the RPC and contract address below.
      # Keys are derived from the dstack KMS, see docs/KEY_DERIVATION.md.
      # The only opt-out, which changes the hash, is adding a literal
      # ALLOW_KEYS_OUTSIDE_ENCLAVE=true here.
      - NODE_ENV=production
      - KMS_URL=${KMS_URL}
      - ETHEREUM_RPC_URLS=${ETHEREUM_RPC_URLS}
      - ZK_CONTRACT_ADDRESS=${ZK_CONTRACT_ADDRESS}
      # No TEE_PLATFORM: production attests only through dstack
    restart: unless-stopped
