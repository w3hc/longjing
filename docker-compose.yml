version: '3.8'

services:
  longjing:
    image: julienberanger/longjing:latest
    pull_policy: always
    ports:
      - "3000:3000"
    volumes:
      # Phala tappd socket (ignored on non-Phala platforms)
      - /var/run/tappd.sock:/var/run/tappd.sock
      # Legacy dstack socket (for backward compatibility)
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - NODE_ENV=${NODE_ENV}
      - KMS_URL=${KMS_URL}
      - ADMIN_MLKEM_PUBLIC_KEY=${ADMIN_MLKEM_PUBLIC_KEY}
      - ADMIN_MLKEM_PRIVATE_KEY=${ADMIN_MLKEM_PRIVATE_KEY}
      # TEE platform override (auto-detect by default)
      # Options: auto | phala | intel-tdx | amd-sev-snp | aws-nitro | mock
      - TEE_PLATFORM=${TEE_PLATFORM:-auto}
    restart: unless-stopped
