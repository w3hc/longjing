version: '3.8'

services:
  longjing:
    # v0.3.0, pinned by digest so the attested compose hash commits to the image.
    # Take the digest from the release notes, see docs/DOCKER.md#releases.
    image: ghcr.io/w3hc/longjing@sha256:d7beb7b690a6a2841530ceb26d18095005af1dd65fa34cc473971657bb096577
    ports:
      - "3000:3000"
    volumes:
      # dstack guest agent: key derivation, TLS key and quotes
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      # Literal, so the attested compose hash commits to production mode.
      # Keys are derived from the dstack KMS, see docs/KEY_DERIVATION.md.
      # The only opt-out, which changes the hash, is adding a literal
      # ALLOW_KEYS_OUTSIDE_ENCLAVE=true here.
      - NODE_ENV=production
      - KMS_URL=${KMS_URL}
      # TEE platform override (auto-detect by default)
      # Options: auto | phala | intel-tdx | amd-sev-snp | aws-nitro | mock
      - TEE_PLATFORM=${TEE_PLATFORM:-auto}
    restart: unless-stopped
