name: Release

on:
  push:
    tags:
      - 'v*'

# A tag pushed twice must not race two releases into the same notes
concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: Build, push and attest the image
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same flags as the reproducibility check in test.yml, so anyone can rebuild the tag and compare
      - name: Build and push
        id: build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          docker buildx build --platform linux/amd64 \
            --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH \
            --output type=image,name=$IMAGE:$GITHUB_REF_NAME,push=true,rewrite-timestamp=true \
            --metadata-file /tmp/metadata.json .
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the digest in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The source commit and the digest are what a reviewer needs to rebuild the image and audit the code
          notes=$(printf '## Image\n\nBuilt from %s/%s/commit/%s.\n\n```yaml\nimage: %s@%s\n```\n\nPin this line in `docker-compose.yml` to deploy this release. See [docs/DOCKER.md](%s/%s/blob/%s/docs/DOCKER.md#releases) to rebuild it and compare the digest.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$IMAGE" "$DIGEST" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            if grep -qF "$IMAGE@$DIGEST" <<<"$body"; then
              exit 0
            fi
            gh release edit "$GITHUB_REF_NAME" --notes "$body"$'\n\n'"$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes"
          fi

  browser-client:
    name: Build, attest and publish the browser client and the withdrawal page
    runs-on: ubuntu-latest
    # The image job creates the release
    needs: image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the browser client
        run: pnpm build:browser

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/browser/longjing-client.js
            build/browser/longjing-client.mjs
            build/browser/withdraw.html

      - name: Publish the files and their sha256 in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            build/browser/longjing-client.js \
            build/browser/longjing-client.mjs \
            build/browser/withdraw.html \
            build/browser/SHA256SUMS
          sums=$(cat build/browser/SHA256SUMS)
          page=$(grep ' withdraw.html$' build/browser/SHA256SUMS)
          # The settlement files the page checks before proving, as circuits/artifacts.json pins them
          pins=$(jq -r '.files | to_entries[] | select(.key == "settlement_js/settlement.wasm" or .key == "settlement.zkey") | "\(.value)  \(.key | split("/") | last)"' circuits/artifacts.json)
          release=$(jq -r .release circuits/artifacts.json)
          notes=$(printf '## Browser client\n\n```\n%s\n```\n\nBuilt from %s/%s/commit/%s with `pnpm build:browser`. Rebuild it and compare with `sha256sum -c SHA256SUMS`. See [docs/API_REFERENCE.md](%s/%s/blob/%s/docs/API_REFERENCE.md#browser-client).\n\n## Withdrawal page\n\n`withdraw.html` exits a note without the server, opened from disk or any mirror:\n\n```\n%s\n```\n\nIt proves with these settlement files, from %s, and refuses any other:\n\n```\n%s\n```\n\nSee [README.md](%s/%s/blob/%s/README.md#withdraw-without-the-service).\n' "$sums" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$page" "$release" "$pins" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME")
          body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          if grep -qF "$sums" <<<"$body"; then
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --notes "$body"$'\n\n'"$notes"
