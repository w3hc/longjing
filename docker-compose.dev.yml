version: '3.8'

services:
  longjing:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - KMS_URL=https://your-kms.example.com/release
      # Force mock platform for local development (no real TEE)
      - TEE_PLATFORM=mock
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
